services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reckon-postgres
    environment:
      POSTGRES_DB: reckon
      POSTGRES_USER: reckon
      POSTGRES_PASSWORD: reckon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reckon -d reckon"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
