spring:
  application:
    name: reckon

  # Optional local-only overrides — drop an application-local.yml next to the
  # pom.xml (gitignored) to override any property below for your environment.
  # Useful when a host port conflicts with the defaults (e.g., system Postgres
  # on 5432) or when running against a remote Ollama instance.
  config:
    import: optional:file:./application-local.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/reckon
    username: reckon
    password: reckon

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: gemma3:4b
          temperature: 0.1
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

rag:
  top-k: 5
  similarity-threshold: 0.65
  chunk-size: 800
  chunk-overlap: 100

logging:
  level:
    com.wassim.reckon: DEBUG
    org.springframework.ai: INFO
